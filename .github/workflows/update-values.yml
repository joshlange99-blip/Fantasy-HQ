name: Update trade values

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~5 AM Central
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update-values.mjs", ".github/workflows/update-values.yml"]

permissions:
  contents: write

concurrency:
  group: update-values
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch values and projections
        run: node scripts/update-values.mjs
      - name: Commit changes
        run: |
          git config user.name "fantasy-hq bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update trade values $(date -u +%F)"
          git pull --rebase origin main
          git push
