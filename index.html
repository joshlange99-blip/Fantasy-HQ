<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Front Office · Fantasy HQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Front Office">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#121211; --surface-1:#1a1a19; --surface-2:#232321; --line:#2f2f2c;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8d8c84;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --pos:#3987e5; --neg:#e66767; --mid:#383835;
  --good:#0ca30c; --warn:#c98500; --bad:#e66767;
  --accent:#3987e5; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
a{color:var(--series-1)}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 80px}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--text-muted)} .sec{color:var(--text-secondary)} .small{font-size:12.5px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1}
.btn{background:var(--accent);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
input[type=text],input[type=number],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{font:12px/1.4 ui-monospace,Menlo,monospace;min-height:120px}
input[type=range]{width:100%;accent-color:var(--accent)}
label.f{display:block;font-size:12.5px;color:var(--text-secondary);margin:8px 0 4px}
header.top{position:sticky;top:0;z-index:5;background:rgba(18,18,17,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{padding-bottom:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--text-secondary)}
.tab.on{background:var(--text-primary);color:#111;border-color:var(--text-primary);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--text-secondary)}
.chip.on{border-color:var(--text-primary);color:var(--text-primary);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pos{display:inline-block;min-width:34px;text-align:center;font-size:11px;font-weight:700;border-radius:6px;padding:2px 5px;background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--line)}
.inj{font-size:11px;font-weight:700;color:var(--bad);margin-left:4px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text-secondary)}
.tag.good{color:var(--good);border-color:var(--good)} .tag.bad{color:var(--bad);border-color:var(--bad)}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.mid{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.bar{height:10px;border-radius:999px;background:var(--neg);overflow:hidden;display:flex}
.bar>span{background:var(--pos);display:block;height:100%}
.list .item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.pname{font-weight:600}
.swap{color:var(--good);font-weight:700}
.err{background:#3a1d1d;border:1px solid #6b2b2b;color:#ffd6d6;border-radius:10px;padding:10px 12px;margin:10px 0}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-secondary)}
.loader{display:flex;align-items:center;gap:10px;color:var(--text-secondary);padding:18px 0}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--text-muted)} .stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.heat td{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--text-secondary);font-size:13px}
.rk{width:30px;color:var(--text-muted);font-variant-numeric:tabular-nums;font-weight:700}
.score{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px}
.chartbox{position:relative;height:260px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.me{color:var(--series-1)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--surface-1);border:1px solid var(--line);border-radius:18px 18px 0 0;max-width:860px;width:100%;max-height:88vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
/* ---- matchup screen ---- */
.mu-head{background:linear-gradient(180deg,#1e1e1c,#161615);border:1px solid var(--line);border-radius:18px;padding:16px 14px 12px;margin:12px 0}
.mu-teams{display:grid;grid-template-columns:1fr 44px 1fr;gap:6px;align-items:start}
.mu-side{min-width:0}
.mu-side.r{text-align:right}
.mu-top{display:flex;align-items:center;gap:8px}
.mu-side.r .mu-top{flex-direction:row-reverse}
.ava{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--surface-2);border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:var(--text-secondary);font-size:16px}
.mu-wp{font-weight:800;font-size:15px}
.mu-proj{color:var(--text-secondary);font-size:13px;font-variant-numeric:tabular-nums}
.mu-wpbar{height:6px;border-radius:999px;background:var(--surface-2);margin:8px 0 10px;overflow:hidden}
.mu-wpbar>span{display:block;height:100%;border-radius:999px}
.mu-side.r .mu-wpbar>span{margin-left:auto}
.mu-name{font-weight:800;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-meta{font-size:12.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-vs{display:grid;place-items:center;height:46px;color:var(--text-muted);font-weight:800;font-size:13px}
.mu-score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin-top:12px}
.mu-ytp{font-size:12px;color:var(--text-muted);margin-top:6px;line-height:1.35}
.streak-w{color:var(--good)} .streak-l{color:var(--bad)}
.mu-weeknav{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 6px}
.mu-weeknav h2{margin:0}
.mu-weeknav .wk{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--series-1)}
.mu-weeknav button{background:none;border:0;color:var(--series-1);font-size:22px;padding:2px 8px;cursor:pointer}
.mu-weeknav button:disabled{opacity:.25}
.mu-row{display:grid;grid-template-columns:1fr 48px 1fr;gap:6px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mu-p{display:flex;gap:6px;align-items:flex-start;min-width:0}
.mu-p.r{flex-direction:row-reverse;text-align:right}
.mu-info{flex:1;min-width:0}
.mu-pn{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-ps{font-size:12.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-cell{min-width:0}.mu-cell.r{text-align:right}
.mu-pg{font-size:12px;color:var(--text-muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-pg.live{color:var(--good);font-weight:600}
.mu-pts{flex:none;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.mu-p.r .mu-pts{text-align:left}
.mu-pts b{display:block;font-size:17px;line-height:1.2}
.mu-pts span{font-size:12px;color:var(--text-muted)}
.mu-pts.win b{color:var(--text-primary)} .mu-pts.lose b{color:var(--text-muted)}
.mu-empty{color:var(--text-muted);font-size:13px}
.pb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#111;margin:0 auto}
.pb.QB{background:#f07ca0}.pb.RB{background:#4fd1a5}.pb.WR{background:#6cb2f5}.pb.TE{background:#f5ad63}.pb.K{background:#b9a6e8}.pb.DEF{background:#a7a69f}
.pb.DL,.pb.LB,.pb.DB,.pb.IDP_FLEX{background:#8fb3a8}
.pb.FLEX{background:linear-gradient(135deg,#4fd1a5 0 33%,#6cb2f5 33% 66%,#f5ad63 66%)}
.pb.WRRB_FLEX{background:linear-gradient(135deg,#4fd1a5 0 50%,#6cb2f5 50%)}
.pb.REC_FLEX{background:linear-gradient(135deg,#6cb2f5 0 50%,#f5ad63 50%)}
.pb.SUPER_FLEX{background:linear-gradient(135deg,#f07ca0 0 25%,#4fd1a5 25% 50%,#6cb2f5 50% 75%,#f5ad63 75%)}
.pb.BN{background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--line)}
.pb span{background:rgba(255,255,255,.82);border-radius:6px;padding:1px 4px}
.pb.QB span,.pb.RB span,.pb.WR span,.pb.TE span,.pb.K span,.pb.DEF span,.pb.BN span{background:none;padding:0}
.bench-toggle{width:100%;margin-top:12px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="wrap">
  <div style="padding:40px 0 10px">
    <div class="muted small">FRONT OFFICE</div>
    <h1 style="font-size:28px">Your fantasy HQ</h1>
    <p class="sec">Enter your Sleeper username or user ID. Every league you're in loads automatically.</p>
  </div>
  <div class="card">
    <label class="f" for="uname">Sleeper username or user ID</label>
    <input id="uname" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="e.g. yourname">
    <div class="row" style="margin-top:12px"><button class="btn" id="goBtn">Load my leagues</button></div>
    <div id="loginErr"></div>
  </div>
  <p class="muted small">Data comes from Sleeper's public, read-only API. Nothing is stored anywhere except this browser.</p>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="wrap">
      <div class="spread">
        <div class="grow" style="min-width:0">
          <div class="muted small" id="whoami"></div>
          <select id="leagueSel" aria-label="League"></select>
        </div>
        <button class="btn ghost sm" id="logoutBtn" title="Switch user">Switch</button>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

<script>
if(window.Chart){ Chart.defaults.animation = false; Chart.defaults.font.family = '-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,sans-serif'; }
/* =========================================================
   Front Office — Sleeper fantasy HQ (single-file app)
   ========================================================= */
const API = 'https://api.sleeper.app/v1';
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=1) => (n==null||isNaN(n)) ? '–' : Number(n).toFixed(d);
const money = n => (n<0?'-':'') + '$' + Math.abs(Math.round(n)).toLocaleString();
const store = {
  get(k, d){ try{ const v = localStorage.getItem('fo:'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('fo:'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('fo:'+k); }catch(e){} }
};

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(`Sleeper returned ${r.status}`);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function pool(items, n, fn){
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => {
    while(i < items.length){ const k = i++; try{ out[k] = await fn(items[k], k); }catch(e){ out[k] = null; } }
  }));
  return out;
}

/* ---------------- global state ---------------- */
const S = {
  user:null, nflState:null, leagues:[], league:null, users:[], rosters:[], myRoster:null,
  players:{}, proj:{}, projWeek:null, trending:{}, tab:'matchup', history:null, charts:[]
};

/* ---------------- players DB (trimmed + cached daily) ---------------- */
async function loadPlayers(){
  const cached = store.get('players', null);
  if(cached && cached.day === new Date().toDateString()){ S.players = cached.p; return; }
  const raw = await getJSON(`${API}/players/nfl`);
  const p = {};
  for(const id in raw){
    const x = raw[id];
    if(!x) continue;
    const pos = x.position || (x.fantasy_positions||[])[0];
    if(!pos) continue;
    p[id] = { n: x.full_name || `${x.first_name||''} ${x.last_name||''}`.trim() || (x.team ? x.team+' D/ST' : id),
              p: pos, fp: x.fantasy_positions || [pos], t: x.team || null, a: x.age || null,
              y: x.years_exp ?? null, i: x.injury_status || null, s: x.status || null, r: x.search_rank ?? 9999 };
  }
  S.players = p;
  store.set('players', {day:new Date().toDateString(), p});
}
const P = id => S.players[id] || { n: (isNaN(id) ? id+' D/ST' : 'Player '+id), p: isNaN(id) ? 'DEF' : '?', fp:[isNaN(id)?'DEF':'?'], t: isNaN(id)?id:null };

/* ---------------- projections (unofficial Sleeper feed, with fallbacks) ---------------- */
const PROJ_CACHE = {};
async function fetchProjections(season, week){
  const key = `${season}-${week}`;
  if(PROJ_CACHE[key]) return PROJ_CACHE[key];
  const positions = ['QB','RB','WR','TE','K','DEF','DL','LB','DB'].map(p=>'position[]='+p).join('&');
  const urls = [
    `https://api.sleeper.app/projections/nfl/${season}/${week}?season_type=regular&${positions}`,
    `https://api.sleeper.com/projections/nfl/${season}/${week}?season_type=regular&${positions}`,
    `${API}/projections/nfl/regular/${season}/${week}`
  ];
  let map = {};
  for(const u of urls){
    try{
      const d = await getJSON(u);
      if(Array.isArray(d)) d.forEach(x => { if(x && x.player_id) map[x.player_id] = x.stats || {}; });
      else if(d && typeof d === 'object') map = d;
      if(Object.keys(map).length) break;
    }catch(e){}
  }
  if(Object.keys(map).length) PROJ_CACHE[key] = map;
  return map;
}
async function loadProjections(season, week){
  const key = `${season}-${week}`;
  if(S.projWeek === key) return;
  S.proj = await fetchProjections(season, week); S.projWeek = key;
}
const projFor = fetchProjections;
function projPts(pid, scoring, map){
  const st = (map || S.proj)[pid];
  if(!st) return 0;
  const sc = scoring || S.league?.scoring_settings || {};
  const rec = sc.rec || 0;
  const fb = rec >= 1 ? st.pts_ppr : rec >= 0.5 ? st.pts_half_ppr : st.pts_std;
  const pos = P(pid).p;
  if((pos === 'DEF' || pos === 'K') && fb != null) return fb;
  let s = 0;
  for(const k in sc){ const v = st[k]; if(typeof v === 'number') s += v * sc[k]; }
  if((!isFinite(s) || s <= 0) && fb != null) return fb;
  return Math.max(0, s);
}

/* ---------------- lineup slots ---------------- */
const SLOT_ELIG = {
  QB:['QB'], RB:['RB'], WR:['WR'], TE:['TE'], K:['K'], DEF:['DEF'],
  FLEX:['RB','WR','TE'], WRRB_FLEX:['WR','RB'], REC_FLEX:['WR','TE'], SUPER_FLEX:['QB','RB','WR','TE'],
  DL:['DL','DE','DT'], LB:['LB'], DB:['DB','CB','S'], IDP_FLEX:['DL','DE','DT','LB','DB','CB','S']
};
const SLOT_LABEL = { FLEX:'FLX', WRRB_FLEX:'W/R', REC_FLEX:'W/T', SUPER_FLEX:'SF', IDP_FLEX:'IDP' };
const starterSlots = () => (S.league.roster_positions || []).filter(s => SLOT_ELIG[s]);
const canPlay = (pid, slot) => { const pl = P(pid); return (SLOT_ELIG[slot]||[]).some(e => (pl.fp||[pl.p]).includes(e)); };
const isSuperflex = () => { const rp = S.league?.roster_positions || []; return rp.includes('SUPER_FLEX') || rp.filter(x=>x==='QB').length > 1; };
const isDynasty = () => S.league?.settings?.type === 2;

function optimalLineup(playerIds, fn = projPts){
  const slots = starterSlots();
  // fill most-restrictive slots first
  const order = slots.map((s,i)=>({s,i})).sort((a,b)=>(SLOT_ELIG[a.s].length - SLOT_ELIG[b.s].length));
  const used = new Set(); const res = new Array(slots.length).fill(null);
  const avail = playerIds.filter(Boolean).map(pid => ({pid, pts: fn(pid)})).sort((a,b)=>b.pts-a.pts);
  for(const {s,i} of order){
    const pick = avail.find(x => !used.has(x.pid) && canPlay(x.pid, s));
    if(pick){ used.add(pick.pid); res[i] = pick.pid; }
  }
  return res;
}
function activePlayers(roster){
  const out = new Set([...(roster.reserve||[]), ...(roster.taxi||[])]);
  return (roster.players||[]).filter(p => !out.has(p));
}

/* ---------------- names ---------------- */
function userById(id){ return S.users.find(u => u.user_id === id); }
function teamName(roster){
  if(!roster) return 'Empty team';
  const u = userById(roster.owner_id);
  return u?.metadata?.team_name || u?.display_name || `Team ${roster.roster_id}`;
}
function ownerName(roster){ const u = userById(roster?.owner_id); return u?.display_name || `Team ${roster?.roster_id}`; }
const rosterById = id => S.rosters.find(r => r.roster_id === id);
const currentWeek = () => {
  const st = S.nflState || {};
  return Math.max(1, Number(st.display_week || st.week || 1));
};
const seasonStr = () => String(S.league?.season || S.nflState?.season);

/* =========================================================
   BOOT
   ========================================================= */
$('#goBtn').onclick = () => start($('#uname').value.trim());
$('#uname').addEventListener('keydown', e => { if(e.key === 'Enter') start($('#uname').value.trim()); });
$('#logoutBtn').onclick = () => { store.del('user'); S.user = null; destroyCharts(); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#loginErr').innerHTML=''; $('#uname').value=''; $('#uname').focus(); };
$('#leagueSel').onchange = e => { store.set('league', e.target.value); openLeague(e.target.value); };

async function start(name){
  if(!name) return;
  $('#loginErr').innerHTML = `<div class="loader"><div class="spin"></div>Finding your account…</div>`;
  try{
    const user = await getJSON(`${API}/user/${encodeURIComponent(name)}`);
    if(!user || !user.user_id) throw new Error(`No Sleeper account found for "${name}".`);
    S.user = user; store.set('user', name);
    S.nflState = await getJSON(`${API}/state/nfl`);
    const season = S.nflState.league_season || S.nflState.season;
    let leagues = await getJSON(`${API}/user/${user.user_id}/leagues/nfl/${season}`) || [];
    if(!leagues.length && S.nflState.previous_season){
      leagues = await getJSON(`${API}/user/${user.user_id}/leagues/nfl/${S.nflState.previous_season}`) || [];
    }

/* ---- NFL schedule: kickoff times, opponents, byes (data/schedule.json, refreshed daily) ---- */
let SCHED = null;
async function loadSchedule(){
  if(SCHED) return SCHED;
  try{ const r = await fetch('data/schedule.json', {cache:'no-cache'}); SCHED = r.ok ? await r.json() : {}; }catch(e){ SCHED = {}; }
  return SCHED;

const GAME_LEN = 3.5*3600e3;
function gameInfo(pid, week){
  const team = P(pid).t; const wk = SCHED?.weeks?.[week];
  if(!wk || !team) return null;                                 // unknown
  const g = wk[team]; if(!g) return { bye:true };
  const kick = new Date(g.kick).getTime(), now = Date.now();
  const started = now >= kick || g.state === 'in' || g.state === 'post';
  const done = g.state === 'post' || now > kick + GAME_LEN;
  const left = !started ? 1 : done ? 0 : Math.max(.05, 1 - (now - kick)/(3.25*3600e3));
  return { ...g, kickMs:kick, started, done, live: started && !done, left };
}
function gameLine(pid, week){
  const gi = gameInfo(pid, week); if(!gi) return '';
  if(gi.bye) return 'BYE';
  const vs = `${gi.home ? 'vs' : '@'} ${gi.opp}`;
  if(gi.live) return `● Live ${vs}`;
  if(gi.done) return `Final ${vs}`;
  return `${new Date(gi.kickMs).toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'})} ${vs}`;
}
const shortName = pid => { const pl = P(pid); if(pl.p === 'DEF') return `${pl.t || pid} D/ST`; const parts = pl.n.split(' '); return parts.length > 1 ? `${parts[0][0]}. ${parts.slice(1).join(' ')}` : pl.n; };
function avatarHTML(roster){

  const init = esc((u?.display_name || '?').slice(0,1).toUpperCase());
  return url ? `<img class="ava" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;ava&quot;>${init}</div>'">` : `<div class="ava">${init}</div>`;
}
function standing(roster){
  const order = [...S.rosters].sort((a,b) => ((b.settings?.wins||0)-(a.settings?.wins||0)) || ((b.settings?.fpts||0)+(b.settings?.fpts_decimal||0)/100 - (a.settings?.fpts||0)-(a.settings?.fpts_decimal||0)/100));
  return order.findIndex(r => r.roster_id === roster.roster_id) + 1;
}
function streakHTML(roster){

  const w = /W$/i.test(st); return `<span class="${w?'streak-w':'streak-l'}">${w?'▲':'▼'}${esc(st)}</span>`;

/* live-aware simulation: finished games are locked in, games in progress use points so far + the remaining share of the projection */
function liveEntries(starters, ptsMap, week, projMap, past){
  return (starters||[]).filter(p => p && p !== '0').map(pid => {
    const actual = ptsMap?.[pid] || 0; const proj = projPts(pid, null, projMap); const pos = P(pid).p;
    const gi = past ? { done:true } : gameInfo(pid, week);
    if(gi?.bye || gi?.done) return { pid, mu: actual, sd: 0, floor: -99, lock: true };
    let left = gi ? gi.left : (actual !== 0 ? .5 : 1);
    const mu = actual + proj*left; const sd = Math.max(1, proj*(CV[pos]||.5))*Math.sqrt(left);
    return { pid, mu, sd, floor: actual + (pos==='DEF' ? -4 : 0), lock:false };
  });
}
function simEntries(A, B, n = 6000){
  let wins = 0;
  for(let i = 0; i < n; i++){
    let ta = 0, tb = 0;
    for(const x of A) ta += x.lock ? x.mu : Math.max(x.floor, x.mu + x.sd*gauss());
    for(const x of B) tb += x.lock ? x.mu : Math.max(x.floor, x.mu + x.sd*gauss());
    wins += ta > tb ? 1 : ta === tb ? .5 : 0;
  }
  return wins / n;
}
function ytp(starters, week){
  const left = (starters||[]).filter(p => p && p !== '0').filter(p => { const gi = gameInfo(p, week); return gi && !gi.bye && !gi.started; });
  if(!SCHED?.weeks?.[week]) return '';
  if(!left.length) return 'All games started';
  const c = {}; left.forEach(p => { const pos = P(p).p; c[pos] = (c[pos]||0)+1; });
  return `Yet to play (${left.length})<br>${['QB','RB','WR','TE','K','DEF'].filter(k=>c[k]).map(k => `${c[k]>1?c[k]+' ':''}${k}`).join(', ')}`;
}

/* =========================================================
   SIMULATOR
   ========================================================= */
const CV = { QB:.33, RB:.50, WR:.55, TE:.60, K:.45, DEF:.65, DL:.55, LB:.45, DB:.55 };
function gauss(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function simulate(a, b, n=10000){
  const mk = arr => (arr||[]).filter(p => p && p !== '0').map(pid => { const mu = projPts(pid); const pos = P(pid).p; return { pid, mu, sd: Math.max(1.5, mu*(CV[pos]||.5)), floor: pos==='DEF'?-4:0 }; });
  const A = mk(a), B = mk(b);
  let wins = 0; const marg = new Float64Array(n), sa = new Float64Array(n), sb = new Float64Array(n);
  const swing = new Map([...A,...B].map(x => [x.pid, {hiW:0,hi:0,loW:0,lo:0}]));
  const drawsA = A.map(()=>0), drawsB = B.map(()=>0);
  for(let i=0;i<n;i++){
    let ta=0, tb=0;
    for(let j=0;j<A.length;j++){ const x=A[j]; const v=Math.max(x.floor, x.mu + x.sd*gauss()); drawsA[j]=v; ta+=v; }
    for(let j=0;j<B.length;j++){ const x=B[j]; const v=Math.max(x.floor, x.mu + x.sd*gauss()); drawsB[j]=v; tb+=v; }
    const w = ta > tb ? 1 : ta === tb ? .5 : 0; wins += w;
    sa[i]=ta; sb[i]=tb; marg[i]=ta-tb;
    for(let j=0;j<A.length;j++){ const s=swing.get(A[j].pid); if(drawsA[j]>=A[j].mu){s.hi++;s.hiW+=w;}else{s.lo++;s.loW+=w;} }
    for(let j=0;j<B.length;j++){ const s=swing.get(B[j].pid); if(drawsB[j]>=B[j].mu){s.hi++;s.hiW+=w;}else{s.lo++;s.loW+=w;} }
  }
  const pct = (arr,q) => { const s = Array.from(arr).sort((x,y)=>x-y); return s[Math.floor(q*(s.length-1))]; };
  const sw = [...swing.entries()].map(([pid,s]) => ({ pid, mine: A.some(x=>x.pid===pid), delta: (s.hi? s.hiW/s.hi : 0) - (s.lo? s.loW/s.lo : 0) }))
    .sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta));
  return { win: wins/n, n, marg, a:{p10:pct(sa,.1),p50:pct(sa,.5),p90:pct(sa,.9)}, b:{p10:pct(sb,.1),p50:pct(sb,.5),p90:pct(sb,.9)}, swing: sw };
}

          <div class="stat"><div class="k">Their likely score</div><div class="v">${fmt(r.b.p50)}</div><div class="muted small">bad day ${fmt(r.b.p10)} · great day ${fmt(r.b.p90)}</div></div>
        </div>
      </div>
      <div class="card"><h3>Final margin across 10,000 games</h3>
        <div class="legend"><span><i style="background:var(--pos)"></i>You win</span><span><i style="background:var(--neg)"></i>You lose</span></div>
        <div class="chartbox"><canvas id="margChart" aria-label="Distribution of final margins"></canvas></div></div>
      <div class="card"><h3>Players who swing it most</h3>
        <p class="muted small" style="margin-top:0">How much your win chance moves when each player beats his projection vs. falls short.</p>
        <div class="list">${top.map(s => `<div class="item"><span class="pos">${esc(P(s.pid).p)}</span><div class="grow"><div class="pname">${esc(P(s.pid).n)}</div><div class="muted small">${s.mine?'Your team':'Opponent'} · proj ${fmt(projPts(s.pid))}</div></div><div style="text-align:right"><div class="pname">${s.delta>=0?'+':''}${(s.delta*100).toFixed(0)}%</div><div class="muted small">win chance</div></div></div>`).join('')}</div>
        <p class="muted small">This is an estimate. Each player gets a range of outcomes around his projection, wider for boom-or-bust positions like WR and TE. Injuries and in-game news aren't modeled.</p>
      </div>`;
    const ctx = $('#margChart');
    if(window.Chart && ctx){
      S.charts.push(new Chart(ctx, { type:'bar',
        data:{ labels: bins.map(b => (b.x>0?'+':'')+b.x), datasets:[{ data: bins.map(b=>b.c/r.n*100), backgroundColor: bins.map(b => b.x+bw/2 >= 0 ? '#3987e5' : '#e66767'), borderRadius:4, borderSkipped:'start', categoryPercentage:1, barPercentage:.9 }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ title: it => `Margin ${it[0].label} to ${Number(it[0].label)+bw}`, label: it => `${it.parsed.y.toFixed(1)}% of games` } } },
          scales:{ x:{ ticks:{ color:'#8d8c84', maxRotation:0, autoSkip:true, maxTicksLimit:9 }, grid:{display:false}, title:{display:true,text:'Your margin (points)',color:'#8d8c84'} },
                   y:{ ticks:{ color:'#8d8c84', callback:v=>v+'%' }, grid:{ color:'#2f2f2c' } } } } }));
    }
  };
  $('#simRun').onclick = run;
  run();
}

function viewWaivers(){
  const v = $('#view');
  const owned = new Set(S.rosters.flatMap(r => [...(r.players||[]), ...(r.taxi||[]), ...(r.reserve||[])]));
  const slotPos = new Set(starterSlots().flatMap(s => SLOT_ELIG[s]));
  const dyn = isDynasty();
  // your weakest starter at each position (by projection) = the bar a pickup must clear
  const myStarters = (S.myRoster?.starters||[]).filter(p=>p&&p!=='0');
  const worstAt = {};
  myStarters.forEach(p => { const pos = P(p).p; const x = projPts(p); if(worstAt[pos]==null || x < worstAt[pos]) worstAt[pos] = x; });
  const cands = Object.entries(S.players).filter(([id,x]) => !owned.has(id) && x.t && slotPos.has(x.p) && (x.s==null || x.s==='Active'))
    .map(([id,x]) => { const pr = projPts(id); return { id, x, pr, tr: S.trending[id]||0, up: worstAt[x.p]!=null ? pr - worstAt[x.p] : null }; })
    .filter(c => c.pr > 0.5 || c.tr > 0 || (dyn && c.x.a && c.x.a <= 24 && c.x.r < 600));
  const st = store.get('wv', {sort:'proj', pos:'ALL'});
  const positions = ['ALL', ...['QB','RB','WR','TE','K','DEF','DL','LB','DB'].filter(p => slotPos.has(p))];
  const sorts = [['proj','Best this week'],['upgrade','Upgrades for you'],['trend','Trending adds'], ...(dyn?[['young','Young stashes']]:[])];
  const draw = () => {
    let list = cands.filter(c => st.pos==='ALL' || c.x.p===st.pos);
    if(st.sort==='proj') list.sort((a,b)=>b.pr-a.pr);
    if(st.sort==='upgrade') list = list.filter(c=>c.up!=null && c.up>0).sort((a,b)=>b.up-a.up);
    if(st.sort==='trend') list = list.filter(c=>c.tr>0).sort((a,b)=>b.tr-a.tr);
    if(st.sort==='young') list = list.filter(c=>c.x.a && c.x.a<=24).sort((a,b)=>(b.tr*2+b.pr*3+(600-Math.min(600,b.x.r))/20)-(a.tr*2+a.pr*3+(600-Math.min(600,a.x.r))/20));
    list = list.slice(0, 30);
    $('#wvList').innerHTML = list.length ? `<div class="scroll"><table><thead><tr><th>Player</th><th class="n">Proj</th><th class="n">vs your starter</th><th class="n">Adds 48h</th>${dyn?'<th class="n">Age</th>':''}</tr></thead><tbody>
      ${list.map(c => `<tr><td><span class="pos">${esc(c.x.p)}</span> <span class="pname">${esc(c.x.n)}</span>${c.x.i?`<span class="inj">${esc(c.x.i)}</span>`:''}<div class="muted small">${esc(c.x.t)}${c.x.y!=null?` · yr ${c.x.y+1}`:''}</div></td>
        <td class="n">${fmt(c.pr)}</td><td class="n">${c.up==null?'–':`<span style="color:${c.up>0?'var(--good)':'var(--text-muted)'}">${c.up>0?'+':''}${fmt(c.up)}</span>`}</td><td class="n">${c.tr?c.tr.toLocaleString():'–'}</td>${dyn?`<td class="n">${c.x.a??'–'}</td>`:''}</tr>`).join('')}
      </tbody></table></div>` : `<p class="muted">No players match. Try a different filter.</p>`;
  };
  v.innerHTML = `<div class="card"><h2>Waiver wire</h2>
    <p class="muted small" style="margin-top:0">Every unowned player in your league. "vs your starter" compares his projection with your weakest starter at that position this week.</p>
    <div class="chips" id="wvSort">${sorts.map(([k,l])=>`<button class="chip ${st.sort===k?'on':''}" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="chips" id="wvPos" style="margin-top:8px">${positions.map(p=>`<button class="chip ${st.pos===p?'on':''}" data-p="${p}">${p}</button>`).join('')}</div>
    <div id="wvList" style="margin-top:10px"></div></div>`;
  $('#wvSort').querySelectorAll('.chip').forEach(c => c.onclick = () => { st.sort=c.dataset.k; store.set('wv',st); $('#wvSort').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); draw(); });
  $('#wvPos').querySelectorAll('.chip').forEach(c => c.onclick = () => { st.pos=c.dataset.p; store.set('wv',st); $('#wvPos').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); draw(); });
  draw();
}

/* =========================================================
   LEAGUE HISTORY (follows previous_league_id back to the start)
   ========================================================= */
async function loadHistory(progress){
  if(S.history && S.history.forLeague === S.league.league_id) return S.history;
  const seasons = [];
  let id = S.league.league_id, guard = 0;
  while(id && id !== '0' && guard++ < 25){
    progress && progress(`Loading ${seasons.length ? 'season '+(seasons.length+1) : 'this season'}…`);
    const [league, users, rosters, bracket] = await Promise.all([
      getJSON(`${API}/league/${id}`), getJSON(`${API}/league/${id}/users`), getJSON(`${API}/league/${id}/rosters`),
      getJSON(`${API}/league/${id}/winners_bracket`).catch(()=>[])
    ]);
    if(!league) break;
    const lastWeek = league.status === 'complete' ? (league.settings?.last_scored_leg || 17) : Math.max(0, currentWeek() - (S.nflState?.season_type==='regular'?1:0));
    const weeks = Array.from({length: Math.min(18, lastWeek)}, (_,i)=>i+1);
    const mw = await pool(weeks, 6, w => getJSON(`${API}/league/${id}/matchups/${w}`));
    seasons.push({ id, league, users: users||[], rosters: rosters||[], bracket: bracket||[], weeks: mw.map((m,i)=>({week:weeks[i], m:m||[]})) });
    id = league.previous_league_id;
  }
  seasons.reverse(); // oldest first
  const rootId = seasons[0]?.id || S.league.league_id;
  store.set('root:'+S.league.league_id, rootId);
  // name directory: newest name wins
  const names = {};
  seasons.forEach(s => s.users.forEach(u => names[u.user_id] = { name: u.display_name, team: u.metadata?.team_name }));
  // per season results
  const res = seasons.map(s => {
    const rOwner = {}; s.rosters.forEach(r => rOwner[r.roster_id] = r.owner_id);
    const playoffStart = s.league.settings?.playoff_week_start || 15;
    const complete = s.league.status === 'complete';
    const reg = s.rosters.map(r => ({ rid:r.roster_id, uid:r.owner_id, w:r.settings?.wins||0, l:r.settings?.losses||0, t:r.settings?.ties||0,
      pf:(r.settings?.fpts||0)+(r.settings?.fpts_decimal||0)/100, pa:(r.settings?.fpts_against||0)+(r.settings?.fpts_against_decimal||0)/100 }));
    const regOrder = [...reg].sort((a,b)=> (b.w+b.t/2)-(a.w+a.t/2) || b.pf-a.pf);
    // final finish from bracket placement games
    const finish = {};
    if(complete){
      (s.bracket||[]).forEach(g => { if(g.p && g.w && g.l){ finish[g.w] = g.p; finish[g.l] = g.p+1; } });
      const playoffTeams = new Set((s.bracket||[]).flatMap(g=>[g.t1,g.t2]).filter(x=>typeof x==='number'));
      let next = Math.max(0, ...Object.values(finish)) + 1;
      regOrder.filter(t => playoffTeams.has(t.rid) && !finish[t.rid]).forEach(t => finish[t.rid] = next++);
      regOrder.filter(t => !finish[t.rid]).forEach(t => finish[t.rid] = next++);
    }
    const playoffTeams = new Set((s.bracket||[]).flatMap(g=>[g.t1,g.t2]).filter(x=>typeof x==='number'));
    // weekly games
    const games = [];
    s.weeks.forEach(({week, m}) => {
      const byM = {};
      m.forEach(x => { if(x.matchup_id!=null){ (byM[x.matchup_id] ||= []).push(x); } });
      Object.values(byM).forEach(pair => { if(pair.length===2) games.push({ week, playoff: week>=playoffStart, a:{uid:rOwner[pair[0].roster_id], pts:pair[0].points||0}, b:{uid:rOwner[pair[1].roster_id], pts:pair[1].points||0} }); });
    });
    const champ = Object.entries(finish).find(([,f])=>f===1)?.[0];
    const runner = Object.entries(finish).find(([,f])=>f===2)?.[0];
    const third = Object.entries(finish).find(([,f])=>f===3)?.[0];
    return { season: s.league.season, complete, teams: s.rosters.length, reg, regOrder, finish, playoffTeams, games,
      champ: champ ? rOwner[champ] : null, runner: runner ? rOwner[runner] : null, third: third ? rOwner[third] : null,
      pfLeader: [...reg].sort((a,b)=>b.pf-a.pf)[0]?.uid, rOwner, playoffStart };
  });
  S.history = { forLeague: S.league.league_id, rootId, seasons: res, names };
  return S.history;
}
const nm = uid => S.history?.names?.[uid]?.name || userById(uid)?.display_name || 'Unknown';

      a.seasons++; a.w+=t.w; a.l+=t.l; a.t+=t.t; a.pf+=t.pf; a.pa+=t.pa; if(s.playoffTeams.has(t.rid)) a.po++; if(s.finish[t.rid]) a.finishes.push(s.finish[t.rid]); });

/* =========================================================
   TRADE EVALUATOR
   Dynasty: market values from RosterAudit.com (refreshed daily into data/ by a GitHub Action),
            with a built-in age/rank model as a fallback.
   Redraft: rest-of-season projected points above replacement (Sleeper projections).
   Both:    each team's starting lineup before vs. after the trade.
   ========================================================= */
const TV = { dyn:null, picks:null, red:null, loaded:false, live:false };
const RA_API = 'https://rosteraudit.com/wp-json/ra/v1';
async function loadTradeData(){
  if(TV.loaded) return;
  const g = async (u, opt) => { try{ const r = await fetch(u, opt || {cache:'no-cache'}); return r.ok ? await r.json() : null; }catch(e){ return null; } };
  [TV.dyn, TV.picks, TV.red] = await Promise.all([g('data/dynasty-values.json'), g('data/picks.json'), g('data/redraft.json')]);
  if(!TV.dyn){ // no daily file yet: try Roster Audit directly (works only if it allows browser calls)
    const d = await g(`${RA_API}/rankings/values?format_key=sf_ppr`, {});
    if(d){ const sf = {}, one = {}; for(const [id,v] of Object.entries(d.values||d)){ if(/^\d+$/.test(id) && v){ sf[id]=v.sf; one[id]=v['1qb']; } }
      TV.dyn = { asOf: new Date().toISOString().slice(0,10), attribution: d.attribution||'Values by RosterAudit.com', attribution_url: d.attribution_url||'https://rosteraudit.com', formats:{ sf_ppr:sf, '1qb_ppr':one } }; TV.live = true; }
  }
  if(!TV.picks){ const d = await g(`${RA_API}/picks`, {}); if(d && Array.isArray(d.picks)) TV.picks = { picks: d.picks.map(p=>({season:p.pick_season, round:p.pick_round, slot:p.pick_slot, sf:p.val_sf, '1qb':p.val_1qb})) }; }
  TV.loaded = true;
}
function dynFormat(){
  const sc = S.league.scoring_settings || {}; const sf = isSuperflex(); const rec = sc.rec || 0;
  const scoring = (sc.bonus_rec_te||0) > 0 && rec >= 0.75 ? 'ppr_tep' : rec >= 0.75 ? 'ppr' : 'half';
  return { key:(sf?'sf_':'1qb_')+scoring, sf, scoring };
}
function dynTable(){ const f = dynFormat(); const F = TV.dyn?.formats || {}; return F[f.key] || F[(f.sf?'sf_':'1qb_')+'ppr'] || null; }
function fallbackDyn(pid){
  const p = P(pid); const rank = p.r ?? 9999; if(rank >= 9999 || !p.t) return 0;
  let v = 9000*Math.exp(-(rank-1)/110);
  const age = p.a || 26, peak = {QB:30,RB:24.5,WR:26,TE:27}[p.p] || 27, decay = {QB:.04,RB:.14,WR:.08,TE:.07}[p.p] || .08;
  v *= age <= peak ? 1 + Math.min(.25, (peak-age)*.06) : Math.max(.15, 1 - (age-peak)*decay);
  if(p.p === 'QB') v *= isSuperflex() ? 1.35 : .7;
  if(p.p === 'K' || p.p === 'DEF') v *= .05;
  return Math.round(v);
}
const dynValue = pid => { const t = dynTable(); return t ? (t[pid] || 0) : fallbackDyn(pid); };
function rosPts(pid){
  const t = TV.red?.players?.[pid]; if(!t) return null;
  const rec = S.league.scoring_settings?.rec || 0; return rec >= .75 ? t[0] : rec >= .25 ? t[1] : t[2];
}
const rosWeeks = () => TV.red?.weeks || Math.max(1, 18 - currentWeek() + 1);
const rosTotal = pid => { const r = rosPts(pid); return r != null ? r : projPts(pid) * rosWeeks(); };
const rosPerWeek = pid => rosTotal(pid) / rosWeeks();
let replCache = null;
function replacement(){
  if(replCache && replCache.lg === S.league.league_id) return replCache.v;
  const teams = S.league.total_rosters || S.rosters.length || 12;
  const need = {QB:0,RB:0,WR:0,TE:0,K:0,DEF:0};
  starterSlots().forEach(s => {
    if(need[s] != null) need[s] += 1;
    else if(s==='FLEX'){ need.RB+=.45; need.WR+=.45; need.TE+=.1; }
    else if(s==='WRRB_FLEX'){ need.RB+=.5; need.WR+=.5; }
    else if(s==='REC_FLEX'){ need.WR+=.8; need.TE+=.2; }
    else if(s==='SUPER_FLEX'){ need.QB+=.85; need.RB+=.05; need.WR+=.07; need.TE+=.03; }
  });
  const v = {};
  for(const pos in need){ if(!need[pos]) continue;
    const pts = Object.keys(S.players).filter(id => S.players[id].p === pos && S.players[id].t).map(rosTotal).sort((a,b)=>b-a);
    v[pos] = pts[Math.min(pts.length-1, Math.round(need[pos]*teams))] ?? 0; }
  replCache = { lg:S.league.league_id, v }; return v;
}
const redValue = pid => { const r = replacement()[P(pid).p]; if(r == null) return 0; const x = rosTotal(pid); return Math.max(0, x - r) + .03*x; };

/* picks: who owns what, and what each is worth */
let tradedPicks = null;
const nextDraftSeason = () => myPicks().base;
function ownedPicks(rid){
  const { rounds, base } = myPicks(); const out = [];
  for(let y = base; y < base+3; y++) for(let rd = 1; rd <= rounds; rd++) S.rosters.forEach(r => {
    const t = (tradedPicks||[]).find(p => String(p.season)===String(y) && p.round===rd && p.roster_id===r.roster_id);
    if((t ? t.owner_id : r.roster_id) === rid) out.push({ type:'k', season:y, round:rd, orig:r.roster_id });
  });
  return out;
}
function pickSlot(orig, season){
  if(Number(season) !== nextDraftSeason()) return 'mid';
  const order = [...S.rosters].sort((a,b) => ((a.settings?.wins||0)-(b.settings?.wins||0)) || ((a.settings?.fpts||0)-(b.settings?.fpts||0)));
  const q = order.findIndex(r => r.roster_id === orig) / Math.max(1, order.length);
  return q < 1/3 ? 'early' : q < 2/3 ? 'mid' : 'late';
}
function pickValue(k){
  const slot = pickSlot(k.orig, k.season), field = dynFormat().sf ? 'sf' : '1qb';
  const hit = TV.picks?.picks?.find(p => String(p.season)===String(k.season) && p.round===k.round && p.slot===slot);
  if(hit) return hit[field] || 0;
  const base = {1:3200,2:1300,3:550,4:250,5:120}[k.round] || 80;
  return Math.round(base * ({early:1.25, mid:1, late:.8}[slot]) * Math.pow(.92, k.season - nextDraftSeason()));
}
const ordinal = n => n + ({1:'st',2:'nd',3:'rd'}[n] || 'th');
const pickLabel = k => { const sl = pickSlot(k.orig, k.season); return `${k.season} ${sl==='mid'?'':sl[0].toUpperCase()+sl.slice(1)+' '}${ordinal(k.round)}`.replace('  ',' '); };

const T = { lg:null, partner:null, give:[], get:[], mode:null };
const itemKey = it => it.type==='p' ? 'p'+it.id : `k${it.season}-${it.round}-${it.orig}`;
function assetValue(it, mode){
  if(it.type === 'k') return mode === 'dyn' ? pickValue(it) : 0;
  return mode === 'dyn' ? dynValue(it.id) : redValue(it.id);
}
const fmtVal = (v, mode) => mode === 'dyn' ? Math.round(v).toLocaleString() : fmt(v, 0);

async function viewTrade(){
  const v = $('#view');

  if(T.lg !== S.league.league_id){ Object.assign(T, { lg:S.league.league_id, partner:null, give:[], get:[], mode: isDynasty() ? 'dyn' : 'red' }); replCache = null; }
  const others = S.rosters.filter(r => r.roster_id !== S.myRoster.roster_id);

function openAssetPicker(key){

      <div class="pname">${fmtVal(x.val, mode)}</div><span class="tag">Add</span></div>`).join('') || '<p class="muted">No matches.</p>';
    $('#apList').querySelectorAll('.item').forEach(el => el.onclick = () => {
      const x = rows[Number(el.dataset.i)]; T[key].push(x.it);
      el.style.opacity = .35; el.onclick = null; el.querySelector('.tag').textContent = 'Added';
    });
  };
  $('#apQ').oninput = draw; draw();
  $('#apClose').onclick = () => { closeModal(); drawTrade(); };
  $('#modal').classList.remove('hidden');
}
function lineupPoints(ids){ return optimalLineup(ids, rosPerWeek).reduce((a,p) => a + (p ? rosPerWeek(p) : 0), 0); }
function drawTradeResult(){
  const out = $('#trResult'); const mode = T.mode;
  if(!T.give.length || !T.get.length){ out.innerHTML = `<div class="note">Add at least one asset to each side to see the evaluation.</div>`; return; }
  const G = T.give.reduce((a,it) => a + assetValue(it, mode), 0), R = T.get.reduce((a,it) => a + assetValue(it, mode), 0);
  const pct = (R - G) / Math.max(1, Math.max(G, R));
  const verdict = Math.abs(pct) < .05 ? ['Fair trade', 'var(--text-primary)'] : pct >= .15 ? ['Clear win for you', 'var(--good)'] : pct > 0 ? ['Slight win for you', 'var(--good)']
                : pct <= -.15 ? ["You're overpaying", 'var(--bad)'] : ['Slight overpay', 'var(--warn)'];
  // lineup impact
  const partner = rosterById(T.partner);
  const gIds = T.give.filter(i=>i.type==='p').map(i=>i.id), rIds = T.get.filter(i=>i.type==='p').map(i=>i.id);
  const mine = activePlayers(S.myRoster), theirs = activePlayers(partner);
  const myB = lineupPoints(mine), myA = lineupPoints([...mine.filter(p => !gIds.includes(p)), ...rIds]);
  const thB = lineupPoints(theirs), thA = lineupPoints([...theirs.filter(p => !rIds.includes(p)), ...gIds]);
  const dlt = (a,b) => { const d = a - b; return `<span style="color:${d>0.05?'var(--good)':d<-0.05?'var(--bad)':'var(--text-secondary)'}">${d>0?'+':''}${fmt(d)}</span>`; };
  // balancing suggestion
  const D = Math.abs(R - G); let sugg = '';
  if(Math.abs(pct) >= .05){
    const fromRoster = pct < 0 ? partner : S.myRoster;            // who should add
    const used = new Set([...T.give, ...T.get].map(itemKey));
    const pool = [...(fromRoster.players||[]).map(id => ({type:'p', id})), ...(isDynasty() && mode==='dyn' ? ownedPicks(fromRoster.roster_id) : [])]
      .filter(it => !used.has(itemKey(it))).map(it => ({it, val: assetValue(it, mode)})).filter(x => x.val >= D*.5 && x.val <= D*1.4)
      .sort((a,b) => Math.abs(a.val-D) - Math.abs(b.val-D)).slice(0, 3);
    if(pool.length) sugg = `<h3 style="margin-top:14px">${pct < 0 ? 'To even it out, ask them to add one of:' : 'To make it fairer for them, you could add one of:'}</h3>
      <div class="list">${pool.map(x => `<div class="item"><span class="pos">${x.it.type==='p'?esc(P(x.it.id).p):'PICK'}</span><span class="grow pname">${x.it.type==='p'?esc(P(x.it.id).n):esc(pickLabel(x.it))}</span><span class="muted">${fmtVal(x.val, mode)}</span></div>`).join('')}</div>`;
  }
  const ages = ids => { const a = ids.map(id => P(id).a).filter(Boolean); return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; };
  const ag = ages(gIds), ar = ages(rIds);
  const spots = T.get.filter(i=>i.type==='p').length - T.give.filter(i=>i.type==='p').length;
  const share = R / Math.max(1, G + R) * 100;
  out.innerHTML = `<div class="card">
      <div class="spread"><h2 style="margin:0;color:${verdict[1]}">${verdict[0]}</h2><span class="tag">${pct>=0?'+':''}${(pct*100).toFixed(0)}%</span></div>
      <div class="grid2" style="margin-top:10px">
        <div class="stat"><div class="k">You give</div><div class="v">${fmtVal(G, mode)}</div></div>
        <div class="stat"><div class="k">You get</div><div class="v">${fmtVal(R, mode)}</div></div>
      </div>
      <div class="bar" style="margin-top:10px" role="img" aria-label="You receive ${share.toFixed(0)} percent of the total value"><span style="width:${share.toFixed(1)}%"></span></div>
      <div class="spread small muted" style="margin-top:4px"><span>Your share ${share.toFixed(0)}%</span><span>${mode==='dyn'?'Dynasty market value':'Rest-of-season points above replacement'}</span></div>
      ${sugg}
    </div>
    <div class="card"><h3>Starting lineup impact</h3>
      <p class="muted small" style="margin-top:0">Best projected lineup, average points per week for the rest of the season.</p>
      <table><thead><tr><th></th><th class="n">Before</th><th class="n">After</th><th class="n">Change</th></tr></thead><tbody>
        <tr><td class="pname">You</td><td class="n">${fmt(myB)}</td><td class="n">${fmt(myA)}</td><td class="n">${dlt(myA, myB)}</td></tr>
        <tr><td>${esc(teamName(partner))}</td><td class="n">${fmt(thB)}</td><td class="n">${fmt(thA)}</td><td class="n">${dlt(thA, thB)}</td></tr>
      </tbody></table>
      <p class="muted small">${spots > 0 ? `You'll need to open ${spots} roster spot${spots===1?'':'s'} to make this trade.` : spots < 0 ? `This frees up ${-spots} roster spot${spots===-1?'':'s'} for a waiver pickup.` : 'Roster counts stay the same.'}
      ${isDynasty() && ag && ar ? ` Average age: you give ${ag.toFixed(1)}, you get ${ar.toFixed(1)}.` : ''}</p>
    </div>`;
}

/* =========================================================
   ROOKIE BOARD (dynasty only)
   Inputs are 0–100 except projected pick and age. Defaults are
   starting estimates from rookies.json — everything is editable.
   ========================================================= */
// Prospect data lives in rookies.json (updated weekly by a scheduled job). pick = projected overall NFL pick, prod = college production 0-100.
let ROOKIES = { asOf:null, draftClass:null, updates:[], prospects:[] };
async function loadRookies(){
  try{ const r = await fetch('rookies.json', {cache:'no-cache'}); if(r.ok) ROOKIES = await r.json(); }catch(e){}
}
const fmtDate = d => { try{ return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return d; } };
const DEFAULT_WEIGHTS = { draft:35, prod:30, ath:10, age:10, land:10, mine:5 };
const W_LABEL = { draft:'Draft capital', prod:'College production', ath:'Athleticism (combine)', age:'Age / early declare', land:'Landing spot', mine:'My film grade' };
const W_HELP = { draft:'Projected NFL pick now, actual pick after the April draft. The strongest predictor of fantasy success.', prod:'College stats and share of the offense, 0–100.', ath:'Fill in after the combine. Blank counts as average.', age:'Younger breakouts hit more often. Blank counts as average.', land:'Fill in after the draft: opportunity, offense and QB. Blank counts as average.', mine:'Your own take, 0–100.' };

function rookieData(){
  const edits = store.get('rk:edits', {});      // id -> partial overrides
  const added = store.get('rk:added', []);      // custom prospects
  const removed = new Set(store.get('rk:removed', []));
  return [...(ROOKIES.prospects||[]), ...added].filter(r => !removed.has(r.id)).map(r => ({...r, ...(edits[r.id]||{})}));
}
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
function rookieScore(r, w, sf){
  const draft = r.pick ? clamp(100*Math.exp(-(r.pick-1)/55), 0, 100) : 30;
  const age = r.age ? clamp(50 + (22.5 - r.age)*25, 0, 100) : 50;
  const comp = { draft, prod: r.prod ?? 50, ath: r.ath ?? 50, age, land: r.land ?? 50, mine: r.mine ?? 50 };
  const tw = Object.values(w).reduce((a,b)=>a+b,0) || 1;
  let s = Object.keys(w).reduce((a,k)=>a + comp[k]*w[k], 0) / tw;
  const posAdj = { QB: sf ? 1.06 : 0.80, RB: 1.0, WR: 1.0, TE: 0.88 }[r.pos] ?? 1;
  return { score: s*posAdj, comp };
}
function myPicks(){
  // rookie picks you own for the next 3 drafts (own picks minus traded away, plus acquired)
  const rounds = S.league.settings?.draft_rounds || 4;
  const base = Number(S.league.season) + (S.league.status === 'complete' ? 1 : (S.league.status==='pre_draft'||S.league.status==='drafting' ? 0 : 1));
  return { rounds, base };
}
async function viewRookies(){
  const v = $('#view');
  const w = store.get('rk:w', DEFAULT_WEIGHTS);
  let sf = store.get('rk:sf:'+S.league.league_id, isSuperflex());
  let posF = store.get('rk:pos', 'ALL');
  const tierName = s => s>=80?'Tier 1':s>=70?'Tier 2':s>=62?'Tier 3':s>=55?'Tier 4':'Tier 5';
  v.innerHTML = `
    <div class="card"><div class="spread"><h2>${ROOKIES.draftClass||''} rookie board</h2><span class="tag">${ROOKIES.asOf?'Updated '+fmtDate(ROOKIES.asOf):'No data'}</span></div>
      ${!(ROOKIES.prospects||[]).length ? `<div class="err">Couldn't load the prospect list (rookies.json). Open the app from its web link rather than as a downloaded file.</div>` : ''}
      <p class="muted small" style="margin-top:0">Ranked by a weighted model you control. Starting values are my estimates from public scouting coverage. Edit any player, and add the combine and landing-spot numbers as they come out.</p>
      <div class="row"><label class="row small"><input type="checkbox" id="rkSF" ${sf?'checked':''} style="width:auto"> Superflex (QBs worth more)</label></div>
      <div class="chips" id="rkPos" style="margin-top:8px">${['ALL','QB','RB','WR','TE'].map(p=>`<button class="chip ${posF===p?'on':''}" data-p="${p}">${p}</button>`).join('')}</div>
    </div>
    ${(ROOKIES.updates||[]).length ? `<div class="card"><details ${store.get('rk:seen',null)!==ROOKIES.updates[0].date?'open':''} id="rkNew"><summary><b>What's new</b> · ${fmtDate(ROOKIES.updates[0].date)}${store.get('rk:seen',null)!==ROOKIES.updates[0].date?' <span class="tag good">NEW</span>':''}</summary>
      <div class="list" style="margin-top:6px">${ROOKIES.updates.slice(0,6).map(u=>`<div class="item" style="display:block"><div class="muted small">${fmtDate(u.date)}</div><div class="small">${esc(u.text)}</div></div>`).join('')}</div></details></div>` : ''}
    <div class="card"><details id="rkW"><summary><b>Model weights</b> · tap to adjust</summary>
      <div id="rkWBody" style="margin-top:8px"></div>
      <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="rkWReset">Reset to defaults</button></div></details></div>
    <div class="card" style="padding:6px 14px"><div class="list" id="rkList"></div></div>
    <div class="card"><div class="row"><button class="btn ghost sm" id="rkAdd">+ Add prospect</button><button class="btn ghost sm" id="rkIO">Import / export</button><button class="btn ghost sm" id="rkReset">Reset all edits</button></div></div>
    <div class="card" id="rkPicks"></div>`;
  const drawW = () => {
    const tw = Object.values(w).reduce((a,b)=>a+b,0)||1;
    $('#rkWBody').innerHTML = Object.keys(DEFAULT_WEIGHTS).map(k => `<div style="margin:10px 0"><div class="spread small"><b>${W_LABEL[k]}</b><span class="muted">${Math.round(w[k]/tw*100)}%</span></div>
      <input type="range" min="0" max="60" value="${w[k]}" data-k="${k}"><div class="muted small">${W_HELP[k]}</div></div>`).join('');
    $('#rkWBody').querySelectorAll('input').forEach(i => i.oninput = () => { w[i.dataset.k] = Number(i.value); store.set('rk:w', w); drawW(); drawList(); });
  };
  const drawList = () => {
    const data = rookieData().map(r => ({ r, ...rookieScore(r, w, sf) })).sort((a,b)=>b.score-a.score);
    const posRank = {}; data.forEach(d => d.pr = (posRank[d.r.pos] = (posRank[d.r.pos]||0)+1));
    const shown = data.map((d,i)=>({...d, ovr:i+1})).filter(d => posF==='ALL' || d.r.pos===posF);
    let lastTier = null;
    $('#rkList').innerHTML = shown.map(d => { const t = tierName(d.score); const hdr = t!==lastTier ? `<div class="muted small" style="padding:10px 0 2px;font-weight:700">${t.toUpperCase()}</div>` : ''; lastTier = t;
      return hdr + `<div class="item" data-id="${d.r.id}" style="cursor:pointer"><div class="rk">${d.ovr}</div><span class="pos">${esc(d.r.pos)}${d.pr}</span>
        <div class="grow" style="min-width:0"><div class="pname">${esc(d.r.name)}</div><div class="muted small">${esc(d.r.school||'')}${d.r.ht?` · ${esc(d.r.ht)}`:''}${d.r.wt?`, ${d.r.wt}`:''} · proj pick ${d.r.pick??'–'}</div></div>
        <div class="score">${d.score.toFixed(1)}</div></div>`; }).join('');
    $('#rkList').querySelectorAll('.item').forEach(el => el.onclick = () => openRookie(el.dataset.id, drawList));
  };
  $('#rkSF').onchange = e => { sf = e.target.checked; store.set('rk:sf:'+S.league.league_id, sf); drawList(); };
  $('#rkPos').querySelectorAll('.chip').forEach(c => c.onclick = () => { posF = c.dataset.p; store.set('rk:pos', posF); $('#rkPos').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); drawList(); });
  $('#rkWReset').onclick = () => { Object.assign(w, DEFAULT_WEIGHTS); store.set('rk:w', w); drawW(); drawList(); };
  $('#rkReset').onclick = () => { if($('#rkReset').dataset.c){ ['rk:edits','rk:added','rk:removed'].forEach(store.del); delete $('#rkReset').dataset.c; $('#rkReset').textContent='Reset all edits'; drawList(); } else { $('#rkReset').dataset.c='1'; $('#rkReset').textContent='Tap again to confirm'; } };
  $('#rkAdd').onclick = () => openRookie(null, drawList);
  $('#rkIO').onclick = openRookieIO;
  drawW(); drawList();
  if((ROOKIES.updates||[]).length) store.set('rk:seen', ROOKIES.updates[0].date);
  // your picks
  try{
    const traded = await getJSON(`${API}/league/${S.league.league_id}/traded_picks`) || [];
    const { rounds, base } = myPicks();
    const myRid = S.myRoster.roster_id; const out = [];
    for(let y = base; y < base+3; y++){
      for(let rd = 1; rd <= rounds; rd++){
        S.rosters.forEach(r => {
          const t = traded.find(p => String(p.season)===String(y) && p.round===rd && p.roster_id===r.roster_id);
          const owner = t ? t.owner_id : r.roster_id;
          if(owner === myRid) out.push({ y, rd, from: r.roster_id === myRid ? 'own' : teamName(r) });
        });
      }
    }
    const byY = {}; out.forEach(p => (byY[p.y] ||= []).push(p));
    $('#rkPicks').innerHTML = `<h3>Your rookie draft picks</h3>${Object.keys(byY).length ? Object.entries(byY).map(([y,ps]) => `<div style="margin:6px 0"><b>${y}</b> <span class="muted small">(${ps.length} pick${ps.length===1?'':'s'})</span><div class="chips" style="margin-top:4px">${ps.map(p=>`<span class="chip">Rd ${p.rd}${p.from!=='own'?` · via ${esc(p.from)}`:''}</span>`).join('')}</div></div>`).join('') : '<p class="muted">You don\'t own any rookie picks in the next three drafts.</p>'}`;
  }catch(e){ $('#rkPicks').innerHTML = `<p class="muted small">Couldn't load traded picks.</p>`; }
}
function openRookie(id, after){
  const r = id ? rookieData().find(x => x.id === id) : { id:'c'+Date.now(), name:'', pos:'WR', school:'', ht:'', wt:null, pick:100, prod:50, note:'' };
  const isCustom = !(ROOKIES.prospects||[]).some(x => x.id === r.id);
  const num = (k, lbl, ph='blank = average') => `<div><label class="f">${lbl}</label><input type="number" id="re_${k}" value="${r[k]??''}" placeholder="${ph}"></div>`;
  $('#sheet').innerHTML = `<div class="spread"><h2>${id ? esc(r.name) : 'Add prospect'}</h2><button class="btn ghost sm" id="reClose">Close</button></div>
    ${r.note ? `<p class="sec small">${esc(r.note)}</p>` : ''}
    <div class="edit-grid">
      <div style="grid-column:1/-1"><label class="f">Name</label><input type="text" id="re_name" value="${esc(r.name)}"></div>
      <div><label class="f">Position</label><select id="re_pos">${['QB','RB','WR','TE'].map(p=>`<option ${r.pos===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div><label class="f">School</label><input type="text" id="re_school" value="${esc(r.school||'')}"></div>
      ${num('pick','Projected NFL pick (1–260)','e.g. 40')}${num('prod','College production (0–100)')}
      ${num('ath','Athleticism (0–100)')}${num('age','Age on draft day','e.g. 21.4')}
      ${num('land','Landing spot (0–100)')}${num('mine','My film grade (0–100)')}
      <div style="grid-column:1/-1"><label class="f">Notes</label><input type="text" id="re_note" value="${esc(r.note||'')}"></div>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn" id="reSave">Save</button>${id?`<button class="btn ghost" id="reDel">Remove from board</button>`:''}</div>`;
  $('#reClose').onclick = closeModal;
  $('#reSave').onclick = () => {
    const g = k => { const v = $('#re_'+k).value; return v === '' ? null : Number(v); };
    const upd = { name: $('#re_name').value.trim() || 'Unnamed', pos: $('#re_pos').value, school: $('#re_school').value.trim(), note: $('#re_note').value.trim(),
      pick: g('pick'), prod: g('prod'), ath: g('ath'), age: g('age'), land: g('land'), mine: g('mine') };
    if(isCustom){ const added = store.get('rk:added', []).filter(x => x.id !== r.id); added.push({...r, ...upd}); store.set('rk:added', added); }
    else { const edits = store.get('rk:edits', {}); edits[r.id] = upd; store.set('rk:edits', edits); }
    closeModal(); after();
  };
  if(id) $('#reDel').onclick = () => {
    if(isCustom) store.set('rk:added', store.get('rk:added', []).filter(x => x.id !== r.id));
    else store.set('rk:removed', [...store.get('rk:removed', []), r.id]);
    closeModal(); after();
  };
  $('#modal').classList.remove('hidden');
}
function openRookieIO(){
  const payload = JSON.stringify({ edits: store.get('rk:edits', {}), added: store.get('rk:added', []), removed: store.get('rk:removed', []), weights: store.get('rk:w', DEFAULT_WEIGHTS) });
  $('#sheet').innerHTML = `<div class="spread"><h2>Import / export</h2><button class="btn ghost sm" id="ioClose">Close</button></div>
    <p class="sec small">Copy this to back up your board or move it to another device. To bring in an update, paste it below and tap Import.</p>
    <textarea id="ioTxt">${esc(payload)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="ioCopy">Copy</button><button class="btn" id="ioImp">Import</button></div><div id="ioMsg" class="small"></div>`;
  $('#ioClose').onclick = closeModal;
  $('#ioCopy').onclick = async () => { try{ await navigator.clipboard.writeText($('#ioTxt').value); $('#ioMsg').textContent = 'Copied.'; }catch(e){ $('#ioTxt').select(); $('#ioMsg').textContent = 'Select all and copy.'; } };
  $('#ioImp').onclick = () => {
    try{ const d = JSON.parse($('#ioTxt').value);
      if(d.edits) store.set('rk:edits', {...store.get('rk:edits', {}), ...d.edits});
      if(d.added){ const ids = new Set(d.added.map(x=>x.id)); store.set('rk:added', [...store.get('rk:added', []).filter(x=>!ids.has(x.id)), ...d.added]); }
      if(d.removed) store.set('rk:removed', [...new Set([...store.get('rk:removed', []), ...d.removed])]);
      if(d.weights) store.set('rk:w', d.weights);
      closeModal(); render();
    }catch(e){ $('#ioMsg').innerHTML = `<span style="color:var(--bad)">That doesn't look like a valid export.</span>`; }
  };
  $('#modal').classList.remove('hidden');
}

/* boot: shared config + rookie data, then auto-login (this device's last user, else the repo's default user) */
(async () => {
  await Promise.all([loadConfig(), loadRookies()]);
  const u = store.get('user', null) || CONFIG.sleeperUser;
  if(u){ $('#uname').value = u; start(u); }
})();
</script>
